apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-discovery-reader
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-discovery-reader
subjects:
  - kind: ServiceAccount
    name: k8s-discovery
roleRef:
  kind: Role
  name: k8s-discovery-reader
  apiGroup: rbac.authorization.k8s.io
